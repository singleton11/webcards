[package]
name = "webcards-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio", "query"] }
hex = "0.4.3"
url = "2.5.8"
percent-encoding = "2.3.2"
subtle = "2.6.1"
unicode-normalization = "0.1.25"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.31"
hmac = "0.12.1"
httpdate = "1.0.3"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
scrypt = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "json", "env-filter"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
